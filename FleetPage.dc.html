<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .m { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; }
</style>
</helmet>

<!-- Fleet page: hosts that envs run on. `vm.rows` from the shell. -->
<div style="margin-top: 18px; border-top: 1px solid #e2e2e0; max-width: 560px;">
  <sc-for list="{{ vm.rows }}" as="h" hint-placeholder-count="4">
    <div style="{{ h.style }}">
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <span class="m" style="font-weight: 700; color: {{ h.nameColor }};">{{ h.name }}</span>
        <span class="m" style="font-size: 12px; color: {{ h.statusColor }};">{{ h.status }}</span>
        <span class="m" style="font-size: 12px; margin-left: auto; color: #8a8a86;">{{ h.envs }}</span>
      </div>
      <div class="m" style="font-size: 11.5px; color: #9a9a96; margin-top: 3px;">{{ h.meta }}</div>
    </div>
  </sc-for>
</div>
</x-dc>
</body>
</html>
