<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .m { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-weight: 400; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: #8a8a86; padding: 0 14px 7px 0; border-bottom: 1px solid #d6d6d6; }
  td { padding: 8px 14px 8px 0; border-bottom: 1px solid #ededeb; font-size: 13px; vertical-align: top; }
</style>
</helmet>

<!-- Envs page: list table, single-env detail panel, or the Watch picker.
     Driven entirely by the `vm` prop the shell passes in. -->
<div>

  <!-- LIST TABLE -->
  <sc-if value="{{ vm.isTable }}">
    <table style="margin-top: 18px;">
      <thead><tr>
        <th>Name</th><th>Snap</th><th>Host</th><th>Status</th><th>Started</th><th>Runtime</th><th>Used</th><th>Limit</th>
      </tr></thead>
      <tbody>
        <sc-for list="{{ vm.rows }}" as="e" hint-placeholder-count="5">
          <tr onClick="{{ e.onClick }}" style="cursor: pointer;" style-hover="background: #f7f7f6;">
            <td style="font-weight: 700;">{{ e.name }}</td>
            <td class="m" style="color: #555;">{{ e.snap }}</td>
            <td class="m" style="color: #555;">{{ e.host }}</td>
            <td class="m"><span style="color: {{ e.statusColor }};">{{ e.status }}</span></td>
            <td class="m" style="color: #555;">{{ e.started }}</td>
            <td class="m" style="color: #555;">{{ e.runtime }}</td>
            <td class="m" style="color: #555;">{{ e.used }}</td>
            <td class="m" style="color: #555;">{{ e.limit }}</td>
          </tr>
        </sc-for>
      </tbody>
    </table>
    <div style="font-size: 12px; color: #9a9a96; margin-top: 12px;">Click a row to inspect it.</div>
  </sc-if>

  <!-- DETAIL PANEL -->
  <sc-if value="{{ vm.isDetail }}">
    <div style="margin-top: 18px; border: 1px solid #d6d6d6; max-width: 600px;">
      <sc-for list="{{ vm.detail.rows }}" as="r" hint-placeholder-count="9">
        <div style="display: flex; border-bottom: 1px solid #ededeb;">
          <div style="flex: none; width: 116px; padding: 7px 12px; color: #8a8a86; font-size: 12px; background: #fafafa; border-right: 1px solid #ededeb;">{{ r.k }}</div>
          <div class="m" style="padding: 7px 12px; font-size: 12.5px; color: #333; min-width: 0; word-break: break-all;"><span style="color: {{ r.color }};">{{ r.v }}</span></div>
        </div>
      </sc-for>
    </div>
    <div style="margin-top: 14px; display: flex; gap: 8px; align-items: center;">
      <sc-if value="{{ vm.detail.watchable }}">
        <a onClick="{{ vm.detail.onWatch }}" style="font-size: 13px; color: #1a4fb4; text-decoration: none; cursor: pointer;">Watch logs ›</a>
      </sc-if>
      <span style="font-size: 12px; color: #9a9a96;">{{ vm.detail.hint }}</span>
    </div>
  </sc-if>

  <!-- WATCH PICKER -->
  <sc-if value="{{ vm.isWatch }}">
    <div style="margin-top: 18px; border-top: 1px solid #e2e2e0; max-width: 620px;">
      <sc-for list="{{ vm.watchRows }}" as="w" hint-placeholder-count="5">
        <div onClick="{{ w.onClick }}" style="{{ w.style }}" style-hover="background: #f7f7f6;">
          <div style="display: flex; align-items: baseline; gap: 10px;">
            <span class="m" style="font-weight: 700; color: {{ w.nameColor }};">{{ w.name }}</span>
            <span class="m" style="font-size: 12px; color: #8a8a86;">{{ w.snap }}</span>
            <span class="m" style="font-size: 12px; margin-left: auto; color: {{ w.statusColor }};">{{ w.status }}</span>
          </div>
          <div class="m" style="font-size: 11.5px; color: #9a9a96; margin-top: 3px;">{{ w.meta }}</div>
        </div>
      </sc-for>
    </div>
  </sc-if>

</div>
</x-dc>
</body>
</html>
